# Netlify build settings. Netlify detects Next.js and applies its
# Next.js adapter automatically; this file pins the build command and Node version.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # These values are public by design (the site URL appears on every page, and
  # the email addresses are the inbox/sender for the contact form), so exclude
  # them from secrets scanning. RESEND_API_KEY is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,CONTACT_TO_EMAIL,CONTACT_FROM_EMAIL"
