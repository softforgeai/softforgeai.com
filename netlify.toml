# Netlify build settings. Netlify detects Next.js and applies its
# Next.js adapter automatically; this file pins the build command and Node version.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # NEXT_PUBLIC_SITE_URL is a public URL that Next.js inlines into the build
  # output by design, so the secrets scanner should not treat it as a secret.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL"
